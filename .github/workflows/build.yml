name: Build PS4 PKG

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'RPI/**'
      - 'sce_module/**'
      - 'sce_sys/**'
      - 'Makefile'
      - '.github/workflows/build.yml'

jobs:
  build:
    runs-on: ubuntu-22.04
    env:
      DOTNET_ROLL_FORWARD: Major
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '3.1.426'

      - name: Install compiler and linker
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-12 lld-12 make imagemagick

      - name: Install OpenOrbis PS4 Toolchain
        shell: bash
        run: |
          set -euo pipefail
          curl -fL "https://github.com/OpenOrbis/OpenOrbis-PS4-Toolchain/releases/download/v0.5.4/toolchain-llvm-18.tar.gz" \
            | tar -xz -C "$RUNNER_TEMP"
          export OO_PS4_TOOLCHAIN="$RUNNER_TEMP/OpenOrbis/PS4Toolchain"
          test -x "$OO_PS4_TOOLCHAIN/bin/linux/PkgTool.Core"
          echo "OO_PS4_TOOLCHAIN=$OO_PS4_TOOLCHAIN" >> "$GITHUB_ENV"
          echo "$OO_PS4_TOOLCHAIN/bin/linux" >> "$GITHUB_PATH"

      - name: Normalize required PS4 icon format
        shell: bash
        run: |
          set -euo pipefail
          # PS4 homebrew package icon0.png must be an opaque 24-bit PNG.
          convert sce_sys/icon0.png -background black -alpha remove -alpha off -depth 8 PNG24:/tmp/icon0-ps4.png
          mv /tmp/icon0-ps4.png sce_sys/icon0.png
          file sce_sys/icon0.png
          identify -format '%m %wx%h %[channels]\n' sce_sys/icon0.png

      - name: Build package
        run: |
          make clean
          make CC=clang-12 CCX=clang++-12 LD=ld.lld-12

      - name: Validate generated PKG
        shell: bash
        run: |
          set -euo pipefail
          PKG="IV0000-BREW01111_00-AAAAAAAAAA000000.pkg"
          test -s "$PKG"
          "$OO_PS4_TOOLCHAIN/bin/linux/PkgTool.Core" pkg_validate --verbose "$PKG"

      - name: Publish PKG artifact
        uses: actions/upload-artifact@v4
        with:
          name: PS4-Remote-Package-Installer-PKG
          path: '*.pkg'
          if-no-files-found: error
